name: capture-fixtures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "curl_cffi>=0.7"
      - run: python probe/capture.py
      - name: commit
        run: |
          git config user.name capture-bot
          git config user.email capture@users.noreply.github.com
          git add probe/fixtures
          git commit -m "capture $(date -u +%FT%TZ)" || echo "no change"
          git push
