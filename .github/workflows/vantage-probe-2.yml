name: vantage-probe-2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "curl_cffi>=0.7"
      - run: python probe/probe2.py
      - name: commit
        run: |
          git config user.name probe-bot
          git config user.email probe@users.noreply.github.com
          git add probe/result2.json probe/*.txt
          git commit -m "probe2 $(date -u +%FT%TZ) ${RUNNER_NAME:-runner}" || echo "no change"
          git push
