name: vantage-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install "curl_cffi>=0.7"
      - name: probe
        run: python probe/run_probe.py
      - name: commit verdict
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe/result.json probe/*.txt
          git commit -m "vantage probe $(date -u +%FT%TZ) from ${RUNNER_NAME:-runner}" || echo "nothing to commit"
          git push
