name: vantage-probe-3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests "curl_cffi>=0.7"
      - run: python probe/probe3.py
      - name: commit
        run: |
          git config user.name probe-bot
          git config user.email probe@users.noreply.github.com
          git add probe/result3.json probe/p3_*.txt
          git commit -m "probe3 $(date -u +%FT%TZ) ${RUNNER_NAME:-runner}" || echo "no change"
          git push
